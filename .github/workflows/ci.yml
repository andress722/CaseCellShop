name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://casecellshop:casecellshop@localhost:5432/casecellshop
      REDIS_URL: redis://localhost:6380
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: docker compose up -d --wait
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
